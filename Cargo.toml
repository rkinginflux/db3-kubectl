[package]
name = "kubectl-db3"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Independent kubectl plugin for database support bundles and Kubernetes logs"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"
tiny_http = { version = "0.12", path = "vendor/tiny_http", features = ["db3-read-only"] }
ctrlc = { version = "3", features = ["termination"] }
getrandom = "0.4"
socket2 = "0.6"
rustix = { version = "1", features = ["process"] }
